<html><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <style>
      ::-webkit-scrollbar { display: none; }
      .glow-button {
          box-shadow: 0 0 20px rgba(70, 78, 255, 0.4);
      }
      .gradient-bg {
          background: linear-gradient(135deg, #1F1F2E 0%, #2A2A3E 100%);
      }
      .accent-gradient {
          background: linear-gradient(135deg, #464EFF 0%, #6C4EE3 100%);
      }
      .pulse-glow {
          animation: pulse-glow 2s infinite;
      }
      @keyframes pulse-glow {
          0%, 100% { box-shadow: 0 0 20px rgba(70, 78, 255, 0.4); }
          50% { box-shadow: 0 0 30px rgba(70, 78, 255, 0.6); }
      }
      .fade-in {
          animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
          from { opacity: 0; transform: scale(0.95); }
          to { opacity: 1; transform: scale(1); }
      }
  </style>
  <script>tailwind.config = {
"theme": {
  "extend": {
    "colors": {
      "dark-bg": "#1F1F2E",
      "primary-accent": "#464EFF",
      "secondary-accent": "#6C4EE3"
    },
    "fontFamily": {
      "sans": [
        "Inter",
        "system-ui",
        "sans-serif"
      ]
    }
  }
}
};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"><style>
    body {
      font-family: 'Inter', sans-serif !important;
    }
    
    /* Preserve Font Awesome icons */
    .fa, .fas, .far, .fal, .fab {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
    }
  </style><style>
.highlighted-section {
  outline: 2px solid #3F20FB;
  background-color: rgba(63, 32, 251, 0.1);
}

.edit-button {
  position: absolute;
  z-index: 1000;
}

::-webkit-scrollbar {
  display: none;
}

html, body {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
</style></head>
<body class="bg-dark-bg text-white overflow-hidden font-custom">

  <div id="focus-reminder-overlay" class="fixed inset-0 z-50 gradient-bg flex flex-col fade-in">
      
      <div id="overlay-header" class="flex justify-between items-center p-6 pt-12">
          <div class="w-8 h-8 rounded-full bg-primary-accent/20 flex items-center justify-center">
              <i class="fas fa-brain text-primary-accent text-sm"></i>
          </div>
          <div class="text-xs text-gray-400 font-medium tracking-wider">NUDGR</div>
          <div class="w-8 h-8"></div>
      </div>

      <div id="reminder-content" class="flex-1 flex flex-col items-center justify-center px-8">
          
          <div id="reminder-image" class="mb-8">
              <div class="relative">
                  <img class="w-72 h-72 rounded-3xl object-cover shadow-2xl" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/c7d6029a38-d563e56d16aa154e30f8.png" alt="inspirational quote image with minimalist design, motivational text on gradient background, modern typography, calming colors">
                  <div class="absolute inset-0 bg-gradient-to-t from-dark-bg/30 to-transparent rounded-3xl"></div>
                  <div class="absolute top-4 right-4 w-8 h-8 bg-black/50 rounded-full flex items-center justify-center backdrop-blur-sm">
                      <i class="fas fa-image text-white text-xs"></i>
                  </div>
              </div>
          </div>

          <div id="reminder-text" class="text-center mb-12">
              <h1 class="text-3xl font-bold mb-4 tracking-tight text-white">
                  TIME TO REFOCUS
              </h1>
              <p class="text-lg text-gray-300 leading-relaxed max-w-xs mx-auto">
                  Take a moment to center yourself and return to what matters most
              </p>
          </div>

          <div id="reminder-stats" class="bg-gray-800/40 rounded-2xl p-4 mb-8 border border-gray-700/50 backdrop-blur-sm">
              <div class="flex items-center justify-center space-x-6 text-sm">
                  <div class="text-center">
                      <div class="text-primary-accent font-bold">12</div>
                      <div class="text-gray-400 text-xs">Unlocks</div>
                  </div>
                  <div class="w-px h-8 bg-gray-600"></div>
                  <div class="text-center">
                      <div class="text-secondary-accent font-bold">05:24</div>
                      <div class="text-gray-400 text-xs">Remaining</div>
                  </div>
                  <div class="w-px h-8 bg-gray-600"></div>
                  <div class="text-center">
                      <div class="text-primary-accent font-bold">3</div>
                      <div class="text-gray-400 text-xs">Nudges</div>
                  </div>
              </div>
          </div>

      </div>

      <div id="reminder-actions" class="px-8 pb-12 space-y-4">
          
          <button id="btn_lock_phone" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 transition-all duration-300 pulse-glow">
              <i class="fas fa-lock text-xl"></i>
              <span class="text-lg">LOCK PHONE</span>
          </button>

          <div class="grid grid-cols-2 gap-4">
              <button id="btn_snooze" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-4 px-4 rounded-2xl flex items-center justify-center space-x-2 transition-all duration-300">
                  <i class="fas fa-clock text-lg"></i>
                  <span>Snooze</span>
              </button>

              <button id="btn_extend" class="bg-secondary-accent hover:bg-purple-600 text-white font-semibold py-4 px-4 rounded-2xl flex items-center justify-center space-x-2 transition-all duration-300">
                  <i class="fas fa-plus text-lg"></i>
                  <span>Extend</span>
              </button>
          </div>

          <div id="action-descriptions" class="space-y-2 pt-4">
              <div class="flex items-center space-x-3 text-xs text-gray-400">
                  <i class="fas fa-lock text-red-400"></i>
                  <span>Lock phone immediately and return to focus</span>
              </div>
              <div class="flex items-center space-x-3 text-xs text-gray-400">
                  <i class="fas fa-clock text-gray-400"></i>
                  <span>Restart countdown from beginning</span>
              </div>
              <div class="flex items-center space-x-3 text-xs text-gray-400">
                  <i class="fas fa-plus text-secondary-accent"></i>
                  <span>Add 5 minutes to next reminder interval</span>
              </div>
          </div>

      </div>

      <div id="overlay-footer" class="px-8 pb-8">
          <div class="flex items-center justify-center space-x-4">
              <div class="w-2 h-2 rounded-full bg-primary-accent"></div>
              <div class="w-2 h-2 rounded-full bg-gray-600"></div>
              <div class="w-2 h-2 rounded-full bg-gray-600"></div>
              <div class="w-2 h-2 rounded-full bg-gray-600"></div>
              <div class="w-2 h-2 rounded-full bg-gray-600"></div>
          </div>
          <p class="text-center text-xs text-gray-500 mt-3">Reminder 1 of 5 this session</p>
      </div>

  </div>

  <div id="dismiss-hint" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-black/50 backdrop-blur-sm rounded-full px-4 py-2 z-60">
      <p class="text-xs text-gray-300 flex items-center space-x-2">
          <i class="fas fa-arrow-up text-primary-accent"></i>
          <span>Swipe up to dismiss</span>
      </p>
  </div>

  <div id="session-progress" class="fixed bottom-0 left-0 right-0 h-1 bg-gray-800 z-40">
      <div class="h-full accent-gradient" style="width: 65%"></div>
  </div>



<script>
let reminderShown = Date.now();
console.log('nudgr_reminder_shown', { timestamp: reminderShown, imageId: 'motivational-1' });

document.getElementById('btn_lock_phone').addEventListener('click', function() {
  console.log('nudgr_action_lock', { timestamp: Date.now() });
  
  this.innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i><span class="text-lg">LOCKING...</span>';
  this.disabled = true;
  
  setTimeout(() => {
      if (typeof Android !== 'undefined' && Android.lockDevice) {
          Android.lockDevice();
      } else {
          alert('Device lock requires admin permissions. Please enable in settings.');
      }
      window.history.back();
  }, 1500);
});

document.getElementById('btn_snooze').addEventListener('click', function() {
  console.log('nudgr_action_snooze', { timestamp: Date.now() });
  
  this.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i><span>Snoozing...</span>';
  this.disabled = true;
  
  setTimeout(() => {
      document.getElementById('focus-reminder-overlay').style.transform = 'translateY(-100%)';
      setTimeout(() => window.history.back(), 300);
  }, 1000);
});

document.getElementById('btn_extend').addEventListener('click', function() {
  console.log('nudgr_action_extend', { timestamp: Date.now(), extension: 300 });
  
  this.innerHTML = '<i class="fas fa-check text-lg"></i><span>Extended</span>';
  this.disabled = true;
  this.classList.remove('bg-secondary-accent');
  this.classList.add('bg-green-600');
  
  setTimeout(() => {
      document.getElementById('focus-reminder-overlay').style.transform = 'translateY(-100%)';
      setTimeout(() => window.history.back(), 300);
  }, 1500);
});

let startY = 0;
document.addEventListener('touchstart', function(e) {
  startY = e.touches[0].clientY;
});

document.addEventListener('touchmove', function(e) {
  let currentY = e.touches[0].clientY;
  let diff = startY - currentY;
  
  if (diff > 100) {
      document.getElementById('focus-reminder-overlay').style.transform = 'translateY(-100%)';
      setTimeout(() => window.history.back(), 300);
  }
});

setTimeout(() => {
  document.getElementById('dismiss-hint').style.opacity = '0';
  setTimeout(() => {
      document.getElementById('dismiss-hint').style.display = 'none';
  }, 500);
}, 3000);
</script>

</body></html>
